<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario HTML</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <section>
        <div class="info">
            <h1>Crie sua Conta</h1>
            <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Voluptatum, corporis quo ad iure praesentium
                veritatis corrupti adipisci distinctio tempore quas sit numquam!</p>
            <img src="./images/Online team meeting _Isometric.svg" alt="Imagem Icon SVG">
        </div>

        <div class="form">
            <h1>Preencha seus Dados</h1>
            <form method="get" action="">

                <div  class="box-form-item">
                    <label for="nome">Nome</label>
                    <i class="fa-regular fa-user icon"></i>
                    <input type="text" name="nome" id="nome" placeholder="Ex: Felipe"  required>
                </div>

                <div class="box-form-item">
                    <label for="sobrenome">Sobrenome</label>
                    <i class="fa-solid fa-user-tag icon"></i>
                    <input type="text" name="sobrenome" id="sobrenome" placeholder="Ex: Durante Slavic"  required>
                </div>

                <div class="box-form-item">
                    <label for="usuario">Usuário</label>
                    <i class="fa-solid fa-user-secret icon"></i>
                    <input type="text" name="usuario" id="usuario" placeholder="Ex: user12498"     required>
                </div>

                <div class="box-form-item">
                    <label for="senha">Senha</label>
                    <i class="fa-solid fa-key icon"></i>
                    <input type="password" name="senha" id="senha" placeholder="Ex: 1234@#$%&*#"    required>
                </div>

                <div class="box-form-item">
                    <label for="email">Email</label>
                    <i class="fa-regular fa-envelope icon"></i>
                    <input type="email" name="email" id="email"  placeholder="Ex: seuemail@email.com"    required>
                </div>

                <div class="box-form-item">
                    <label for="dataNascimento">Data de Nascimento</label>
                        <i class="fa-solid fa-cake-candles icon"></i>
                    <input type="date" name="dataNascimento" id="dataNascimento"   required>
                </div>

                <div class="box-form-item">
                    <label>Tipo de Conta</label>
                    <div class="box-form-radio">
                        <div class="radio">
                            <input type="radio" name="conta" id="free">
                            <label for="free">Free</label>
                        </div>
                        
                        <div class="radio">
                            <input type="radio" name="conta" id="gold">
                            <label for="gold">Gold</label>
                        </div>
                        
                        <div class="radio">
                            <input type="radio" name="conta" id="premium">
                            <label for="premium">Premium</label>
                        </div>
                    </div>
                </div>

                <div class="box-form-item">
                    <label>Área de Atuação</label>
                    <select name="" id="" required>
                        <option value="0" disabled selected>Selecione sua Opção</option>
                        <option value="1">Front-End</option>
                        <option value="2">Back-End</option>
                        <option value="3">Banco de Dados</option>
                        <option value="4">Gestão de TI</option>
                    </select>
                </div>

                <div class="box-form-button">
                    <button>Criar Conta</button>
                </div>
            </form>
        </div>
    </section>
</body>

</html>
